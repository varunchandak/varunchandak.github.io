# About Section
about_profile_image: images/profile.jpeg
about_content: |
  Multi-cloud infrastructure expert with 10+ years of experience securing high-scale workloads across AWS, GCP and Azure. Evolved from a deep Linux systems engineering background into architecting automated, "secure-by-
  default" cloud platforms.
  
  I specialize in integrating security benchmarks directly into the DevOps lifecycle through Infrastructure as Code (IaC) hardening, automated cloud governance, and platform-level threat mitigation. Proven
  track record of building resilient, scalable architectures that maintain rigorous security standards without sacrificing deployment velocity.
  
  I am most skilled in <mark>AWS</mark>, <mark>Cloud Security</mark>, <mark>Automation</mark>, and <mark>DevOps</mark>.

